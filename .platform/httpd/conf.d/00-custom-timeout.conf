# Apache Performance Tuning

# Connection Settings
Timeout 60
KeepAliveTimeout 5
MaxKeepAliveRequests 100

# Process and Thread Management
ServerLimit 64
StartServers 8
MinSpareThreads 200
MaxSpareThreads 500
ThreadLimit 128
ThreadsPerChild 64

# Worker Capacity
MaxRequestWorkers 4096
MaxConnectionsPerChild 5000